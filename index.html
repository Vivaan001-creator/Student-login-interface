<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://storage.googleapis.com https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://www.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self' mailto:">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="GenAlpha home tuition portal: results, attendance, fees and notices in one place.">
<meta name="theme-color" content="#0e1326">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GenAlpha</title>
<style>
  /* This page is the Android app's entry point - NOT a website
     homepage. It shows the brand for a moment (matching the
     native splash screen configured in capacitor.config.json)
     and then sends the person to the right place:
       - already logged in (any role) -> straight to that
         role's dashboard, no login screen shown again
       - not logged in -> the role-picker login screen
     There is no "website home" inside the app anymore. */
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:#ffffff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Segoe UI', Arial, sans-serif;
    overflow:hidden;
  }
  .splash-logo{
    width:220px; max-width:60vw; height:auto;
    animation:logoIn .8s cubic-bezier(.16,.84,.44,1) both;
  }
  @keyframes logoIn{
    0%{ opacity:0; transform:scale(.7); }
    60%{ opacity:1; transform:scale(1.05); }
    100%{ opacity:1; transform:scale(1); }
  }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }
</style>
</head>
<body>

  <img class="splash-logo" src="logo.png" alt="GenAlpha">

  <script>
    function routeToApp() {
      var dest = 'login.html';
      if (localStorage.getItem('adminLoggedIn') === 'true') dest = 'dashboard.html';
      else if (localStorage.getItem('teacherLoggedIn') === 'true') dest = 'teacher-dashboard.html';
      else if (localStorage.getItem('studentLoggedIn') === 'true') dest = 'student-dashboard.html';
      else if (localStorage.getItem('parentLoggedIn') === 'true') dest = 'parent-dashboard.html';
      window.location.replace(dest);
    }
    // Give the entrance animation a moment to actually be seen -
    // this is the "logo with animation" moment on every app open.
    setTimeout(routeToApp, 900);
  </script>

</body>
</html>
