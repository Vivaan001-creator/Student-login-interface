<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://storage.googleapis.com https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://www.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self' mailto:">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Post and manage homework for your classes.">
<meta name="theme-color" content="#0e1326">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="site.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="appearance.js"></script>
<script src="session-timer.js"></script>
<title>Homework - GenAlpha</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --navy-950:#0e1326; --navy-900:#161d3a; --navy-800:#232c56;
    --cream:#fdf6e8; --paper:#f7f2e4;
    --amber:#ffb347; --amber-deep:#ff8c42; --amber-shadow:#d9691f; --coral:#ff6f61;
    --ink:#241f14; --ink-soft:#6d644e; --ink-faint:#a89d84;
    --blue:#4a7fd6; --blue-bg:#e9f0fd;
    --green:#2fb87f; --green-bg:#e4f7ee;
    --red:#e5584a; --red-bg:#fdeceb;
    --radius-lg:24px; --radius-md:16px;
    --surface-card:#ffffff; --surface-card-border:rgba(36,31,20,.06);
    --surface-card-shadow:rgba(36,31,20,.07); --surface-hover:#eee3cc; --nav-surface:#ffffff;
    --brand-yellow:#ffc72c; --brand-ink:#1c1c1c;
    --ease:cubic-bezier(.16,.84,.44,1);
  }

  html[data-theme="dark"]{
    --cream:#1c2444; --cream-dim:#232c56; --paper:#161d3a;
    --ink:#f3ecd9; --ink-soft:#b7bcdc; --ink-faint:#9199bb;
    --green-bg:#173a2c; --red-bg:#3a1e1c; --blue-bg:#1c2c4a;
    --purple-bg:#2a2456; --teal-bg:#173a38; --pink-bg:#3a2038;
    --surface-card:rgba(255,255,255,.045); --surface-card-border:rgba(255,255,255,.1);
    --surface-card-shadow:rgba(0,0,0,.35); --surface-hover:rgba(255,255,255,.07); --nav-surface:#1b2140;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:'Inter', sans-serif; background:var(--paper); color:var(--ink); }
  h1,h2{ font-family:'Fraunces', serif; font-weight:600; }
  a{ text-decoration:none; color:inherit; }

  /* ============ APP SHELL (Android) ============ */
  .app-shell{ min-height:100vh; min-height:100dvh; }
  .top-header{
    background:linear-gradient(135deg, var(--navy-900) 0%, var(--navy-950) 100%); color:#f3ecd9;
    padding:16px 16px 18px; padding-top:calc(16px + env(safe-area-inset-top,0px));
    border-radius:0 0 28px 28px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .top-header-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .header-icon-btn{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; flex-shrink:0; }
  .top-header h1{ font-family:'Fraunces', serif; font-size:16px; }
  .top-header p{ font-size:11px; color:#b7bcdc; margin-top:1px; }
  .header-actions{ display:flex; align-items:center; gap:8px; }

  .content{ padding:18px 16px calc(112px + env(safe-area-inset-bottom,0px)); max-width:640px; margin:0 auto; }

  .bottom-nav{ position:fixed; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--nav-surface); border:1px solid var(--surface-card-border); border-radius:26px; box-shadow:0 16px 36px rgba(20,16,10,.2); display:flex; justify-content:space-around; padding:7px 4px; max-width:612px; margin-left:auto; margin-right:auto; }
  .bn-item{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px; cursor:pointer; color:var(--ink-faint); flex:1; border-radius:16px; }
  .bn-icon-wrap{ width:40px; height:28px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:15px; transition:background .2s var(--ease), color .2s var(--ease); }
  .bn-label{ font-size:9.5px; font-weight:700; }
  .bn-item.bn-active{ color:var(--amber-deep); }
  .bn-item.bn-active .bn-icon-wrap{ background:var(--brand-yellow); color:var(--brand-ink); }

  .page-topbar{ margin-bottom:22px; }
  .page-topbar-left h1{ font-size:clamp(22px,3.5vw,28px); }
  .page-topbar-left p{ font-size:13px; color:var(--ink-soft); margin-top:6px; }

  .empty-state-note{ display:flex; align-items:center; gap:10px; background:#fdf0e3; color:var(--amber-shadow); border:1px solid rgba(217,105,31,.2); border-radius:var(--radius-md); padding:14px 18px; font-size:13px; margin-bottom:18px; }

  .classes-card{ background:var(--surface-card); border:1px solid rgba(36,31,20,.06); border-radius:var(--radius-lg); padding:24px; box-shadow:0 16px 36px rgba(36,31,20,.07); }
  .classes-card-toolbar{ margin-bottom:18px; }
  .search-box-wrap{ position:relative; max-width:420px; }
  .search-box-wrap i{ position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:13px; }
  .search-box-wrap input{ width:100%; padding:12px 16px 12px 40px; border:1.5px solid rgba(36,31,20,.09); border-radius:12px; font-size:13.5px; font-family:inherit; background:var(--paper); transition:border-color .2s var(--ease); }
  .search-box-wrap input:focus{ outline:none; border-color:var(--amber-deep); }

  .table-wrapper{ overflow-x:auto; border-radius:var(--radius-md); border:1px solid rgba(36,31,20,.06); }
  table.classes-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.classes-table th{ text-align:left; background:var(--paper); color:var(--ink-soft); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.3px; padding:13px 16px; white-space:nowrap; }
  table.classes-table td{ padding:13px 16px; border-top:1px solid rgba(36,31,20,.05); }

  .action-btns{ display:flex; gap:6px; flex-wrap:wrap; }
  .action-btns button{ display:inline-flex; align-items:center; gap:5px; border:none; cursor:pointer; font-family:inherit; font-size:11.5px; font-weight:600; padding:7px 12px; border-radius:9px; transition:transform .15s var(--ease); background:var(--blue-bg); color:var(--blue); }
  .btn-view:hover{ transform:translateY(-2px); }

  .toolbar-row{ display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:14px; margin-bottom:18px; }
  .toolbar-row label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .date-input-wrap{ position:relative; width:190px; }
  .date-input-wrap input{ width:100%; padding:11px 14px; border:1.5px solid rgba(36,31,20,.09); border-radius:12px; font-size:13.5px; font-family:inherit; background:var(--paper); color:var(--ink); }
  .date-input-wrap input:focus{ outline:none; border-color:var(--amber-deep); }

  .btn-add-class{
    display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--amber) 0%, var(--coral) 100%); color:#241608;
    font-weight:700; font-size:13.5px; font-family:inherit; padding:12px 22px; border-radius:12px;
    box-shadow:0 4px 0 var(--amber-shadow), 0 10px 22px rgba(255,140,66,.28);
    transition:transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .btn-add-class:hover{ transform:translateY(-2px); box-shadow:0 6px 0 var(--amber-shadow), 0 14px 26px rgba(255,140,66,.34); }
  .btn-add-class:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--amber-shadow), 0 6px 14px rgba(255,140,66,.3); }

  .attendance-toggle{ display:inline-flex; gap:6px; background:var(--paper); padding:4px; border-radius:999px; }
  .att-pill{ border:none; cursor:pointer; font-family:inherit; font-size:11.5px; font-weight:700; padding:7px 14px; border-radius:999px; background:transparent; color:var(--ink-soft); transition:background .18s var(--ease), color .18s var(--ease); }
  .att-present.active{ background:var(--green-bg); color:var(--green); }
  .att-absent.active{ background:var(--red-bg); color:var(--red); }

  .form-section-title{ font-size:14px; font-weight:700; color:var(--amber-shadow); text-transform:uppercase; letter-spacing:.4px; margin-bottom:16px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field.full-width{ grid-column:1 / -1; }
  .field label{ font-size:12.5px; font-weight:600; color:var(--ink); }
  .field label .required{ color:var(--coral); }
  .field label .optional{ color:var(--ink-soft); font-weight:500; font-size:11.5px; }
  .field select, .field textarea{ padding:12px 14px; border:1.5px solid rgba(36,31,20,.1); border-radius:12px; font-size:13.5px; font-family:inherit; background:var(--paper); color:var(--ink); transition:border-color .2s var(--ease); appearance:none; width:100%; }
  .field select:focus, .field textarea:focus, .field input:focus{ outline:none; border-color:var(--amber-deep); }
  .form-actions{ display:flex; justify-content:flex-end; }

  .homework-item{ display:flex; gap:16px; padding:16px 0; border-top:1px solid rgba(36,31,20,.06); }
  .homework-item:first-child{ border-top:none; padding-top:2px; }
  .homework-tag{ display:flex; flex-direction:column; align-items:center; gap:4px; min-width:70px; }
  .homework-tag .subject{ font-size:11px; font-weight:700; color:#241608; background:linear-gradient(135deg, var(--amber), var(--coral)); padding:4px 10px; border-radius:999px; }
  .homework-tag .due{ font-size:10.5px; color:var(--ink-soft); white-space:nowrap; }
  .homework-body{ flex:1; }
  .homework-body h4{ font-size:14px; margin-bottom:3px; }
  .homework-body p{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
  .result-empty-msg{ font-size:13px; color:var(--ink-soft); padding:14px 0; text-align:center; }

  .footer{ text-align:center; font-size:12px; color:var(--ink-faint); padding:20px 0 6px; }

  @media (max-width:900px){
    .content{ padding:18px 16px calc(112px + env(safe-area-inset-bottom,0px)); }
  }
  @media (max-width:760px){
    table.classes-table thead{ display:none; }
    table.classes-table, table.classes-table tbody, table.classes-table tr, table.classes-table td{ display:block; width:100%; }
    table.classes-table tr{ margin-bottom:10px; border:1px solid rgba(36,31,20,.08); border-radius:14px; padding:6px 14px; background:var(--surface-card); }
    table.classes-table td{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 0; border:none; border-bottom:1px solid rgba(36,31,20,.05); text-align:right; }
    table.classes-table td:last-child{ border-bottom:none; }
    table.classes-table td::before{ content:attr(data-label); font-weight:600; color:var(--ink-soft); font-size:11px; text-align:left; }
  }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  .loading-state{ text-align:center; padding:36px 20px; color:var(--ink-soft); font-size:13px; }
  .spinner{ width:32px; height:32px; border:3px solid rgba(255,140,66,.15); border-top-color:var(--amber-deep);
    border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="app-shell">

  <header class="top-header">
    <div class="top-header-left">
      <button class="header-icon-btn" onclick="window.location.href='teacher-dashboard.html'" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
      <div>
        <h1>Homework</h1>
        <p>Add new homework</p>
      </div>
    </div>
    <div class="header-actions">
      <div id="appearanceMount"></div>
      <button class="header-icon-btn" aria-label="Logout" onclick="teacherLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </div>
  </header>

    <main class="content classes-page">
      <div class="empty-state-note" id="noClassMsgHw" style="display:none;">
        <i class="fa-solid fa-circle-info"></i>
        <span>No class has been assigned to you yet. Contact the admin about class-teacher assignment.</span>
      </div>

      <div class="classes-card">
        <div class="form-section-title">Add New Homework</div>
        <div class="form-grid">
          <div class="field">
            <label>Class <span class="required">*</span></label>
            <select id="hwClass" aria-label="Class"></select>
          </div>
          <div class="field">
            <label>Subject <span class="required">*</span></label>
            <input type="text" id="hwSubject" list="hwSubjectList" placeholder="e.g. Math" aria-label="Subject">
            <datalist id="hwSubjectList"></datalist>
          </div>
          <div class="field">
            <label>Due Date <span class="required">*</span></label>
            <input type="date" id="hwDueDate" aria-label="Due date">
          </div>
          <div class="field full-width">
            <label>Title <span class="required">*</span></label>
            <input type="text" id="hwTitle" placeholder="e.g. Chapter 4 - Exercise 4.2" aria-label="Homework title">
          </div>
          <div class="field full-width">
            <label>Description <span class="optional">(Optional)</span></label>
            <textarea id="hwDescription" rows="3" placeholder="Write the homework details" aria-label="Homework details"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-add-class" onclick="addHomework()"><i class="fa-solid fa-plus"></i> Add Homework</button>
        </div>
      </div>

      <div class="classes-card" style="margin-top:20px;">
        <div class="form-section-title">Posted Homework</div>
        <div id="homeworkList"><div class="loading-state"><div class="spinner"></div>Loading...</div></div>
      </div>

      <footer class="footer"><nav class="footer-links" aria-label="Legal"><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="cookies.html">Cookies</a><a href="refund.html">Refunds</a></nav><div>&copy; <span data-year>2026</span> GenAlpha</div></footer>
<script src="site.js"></script>
    </main>

  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<script>
  try { Appearance.renderMenu(document.getElementById('appearanceMount'), { variant: 'inline' }); } catch(e) {}
</script>

<script src="bottom-nav.js"></script>
<script>
  try {
    BottomNav.init({
      mountId: 'bottomNav',
      tabs: [
        { href: 'teacher-dashboard.html',  icon: 'fa-house',             label: 'Home' },
        { href: 'teacher-attendance.html', icon: 'fa-calendar-check',    label: 'Attendance' },
        { href: 'teacher-homework.html',   icon: 'fa-file-lines',        label: 'Homework' },
        { href: 'teacher-tests.html',      icon: 'fa-clipboard-question', label: 'Tests' },
        { href: 'teacher-marks.html',      icon: 'fa-pen-to-square',     label: 'Marks' },
        { href: 'teacher-students.html',   icon: 'fa-user-group',        label: 'Students' }
      ]
    });
  } catch(e) {}
</script>

<script>
  try { SessionTimer.start({ flagKey: 'teacherLoggedIn', loginUrl: 'teacher-login.html' }); } catch(e) {}
</script>

<script type="module" src="teacher.js"></script>
</body>
</html>
