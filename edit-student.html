<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://storage.googleapis.com https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://www.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self' mailto:">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --navy-950:#0e1326; --navy-900:#161d3a; --navy-800:#232c56;
    --paper:#f7f2e4; --amber:#ffb347; --amber-deep:#ff8c42; --amber-shadow:#d9691f; --coral:#ff6f61;
    --ink:#241f14; --ink-soft:#6d644e; --ink-faint:#a89d84;
    --radius-lg:24px; --radius-md:16px;
    --surface-card:#ffffff; --surface-card-border:rgba(36,31,20,.06);
    --surface-card-shadow:rgba(36,31,20,.07); --surface-hover:#eee3cc; --nav-surface:#ffffff;
    --brand-yellow:#ffc72c; --brand-ink:#1c1c1c;
    --ease:cubic-bezier(.16,.84,.44,1);
  }

  html[data-theme="dark"]{
    --cream:#1c2444; --cream-dim:#232c56; --paper:#161d3a;
    --ink:#f3ecd9; --ink-soft:#b7bcdc; --ink-faint:#9199bb;
    --green-bg:#173a2c; --red-bg:#3a1e1c; --blue-bg:#1c2c4a;
    --purple-bg:#2a2456; --teal-bg:#173a38; --pink-bg:#3a2038;
    --surface-card:rgba(255,255,255,.045); --surface-card-border:rgba(255,255,255,.1);
    --surface-card-shadow:rgba(0,0,0,.35); --surface-hover:rgba(255,255,255,.07); --nav-surface:#1b2140;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:'Inter', sans-serif; background:var(--paper); color:var(--ink); }
  h1,h2{ font-family:'Fraunces', serif; font-weight:600; }
  a{ text-decoration:none; color:inherit; }

  /* ============ APP SHELL (Android) ============ */
  .app-shell{ min-height:100vh; min-height:100dvh; }
  .top-header{
    background:linear-gradient(135deg, var(--navy-900) 0%, var(--navy-950) 100%); color:#f3ecd9;
    padding:16px 16px 18px; padding-top:calc(16px + env(safe-area-inset-top,0px));
    border-radius:0 0 28px 28px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .top-header-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .header-icon-btn{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; flex-shrink:0; }
  .top-header h1{ font-family:'Fraunces', serif; font-size:16px; }
  .top-header p{ font-size:11px; color:#b7bcdc; margin-top:1px; }
  .header-actions{ display:flex; align-items:center; gap:8px; }

  .bottom-nav{ position:fixed; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--nav-surface); border:1px solid var(--surface-card-border); border-radius:26px; box-shadow:0 16px 36px rgba(20,16,10,.2); display:flex; justify-content:space-around; padding:7px 4px; max-width:612px; margin-left:auto; margin-right:auto; }
  .bn-item{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px; cursor:pointer; color:var(--ink-faint); flex:1; border-radius:16px; }
  .bn-icon-wrap{ width:40px; height:28px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:15px; transition:background .2s var(--ease), color .2s var(--ease); }
  .bn-label{ font-size:9.5px; font-weight:700; }
  .bn-item.bn-active{ color:var(--amber-deep); }
  .bn-item.bn-active .bn-icon-wrap{ background:var(--brand-yellow); color:var(--brand-ink); }

  .main{ padding:18px 16px calc(112px + env(safe-area-inset-bottom,0px)); max-width:640px; margin:0 auto; }
  .page-topbar{ margin-bottom:22px; }
  .page-topbar h1{ font-size:clamp(22px,3.5vw,28px); }
  .page-topbar p{ font-size:13px; color:var(--ink-soft); margin-top:6px; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:10px; transition:color .2s var(--ease); }
  .back-link:hover{ color:var(--amber-deep); }

  .form-card{ background:var(--surface-card); border:1px solid rgba(36,31,20,.06); border-radius:var(--radius-lg); padding:28px 26px; box-shadow:0 16px 36px rgba(36,31,20,.07); }
  .form-section-title{ font-size:14px; font-weight:700; color:var(--amber-shadow); text-transform:uppercase; letter-spacing:.4px; margin:26px 0 16px; }
  .form-section-title:first-child{ margin-top:0; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field.full-width{ grid-column:1 / -1; }
  .field label{ font-size:12.5px; font-weight:600; color:var(--ink); }
  .field label .req{ color:var(--coral); }
  .field input, .field select, .field textarea{
    padding:12px 14px; border:1.5px solid rgba(36,31,20,.1); border-radius:12px; font-size:13.5px;
    font-family:inherit; background:var(--paper); color:var(--ink); transition:border-color .2s var(--ease);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--amber-deep); }
  .field textarea{ resize:vertical; min-height:80px; }

  .photo-upload-row{ display:flex; align-items:center; gap:16px; margin-top:4px; }
  .photo-upload-btn{ display:inline-flex; align-items:center; gap:8px; background:var(--paper); border:1.5px dashed rgba(36,31,20,.18); border-radius:12px; padding:11px 18px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; transition:border-color .2s var(--ease), color .2s var(--ease); }
  .photo-upload-btn:hover{ border-color:var(--amber-deep); color:var(--amber-deep); }
  #uploadFilename{ font-size:12px; color:var(--ink-soft); }

  .form-actions{ display:flex; gap:12px; justify-content:flex-end; margin-top:28px; padding-top:22px; border-top:1px solid rgba(36,31,20,.07); }
  .btn{ display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer; font-family:inherit; font-size:13.5px; font-weight:700; padding:12px 24px; border-radius:12px; transition:transform .15s var(--ease), box-shadow .15s var(--ease); }
  .btn-primary{ background:linear-gradient(135deg, var(--amber) 0%, var(--coral) 100%); color:#241608; box-shadow:0 4px 0 var(--amber-shadow), 0 12px 24px rgba(255,140,66,.28); }
  .btn-primary:hover{ transform:translateY(-2px); }
  .btn-primary:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--amber-shadow); }
  .btn-secondary{ background:var(--paper); color:var(--ink-soft); border:1.5px solid rgba(36,31,20,.09); }
  .btn-secondary:hover{ background:#eee3cc; }

  @media (max-width:900px){
    .form-grid{ grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="app-shell">

  <header class="top-header">
    <div class="top-header-left">
      <button class="header-icon-btn" onclick="window.location.href='students.html'" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
      <div>
        <h1>Edit Student</h1>
        <p>Update the student's details</p>
      </div>
    </div>
    <div class="header-actions">
      <div id="appearanceMount"></div>
      <button class="header-icon-btn" aria-label="Logout" onclick="adminLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </div>
  </header>

  <div class="main">
    <form id="studentForm" class="form-card">

      <div class="form-section-title">Basic Details</div>
      <div class="form-grid">
        <div class="field"><label for="roll">Roll Number</label><input type="text" id="roll" disabled style="opacity:.65;"></div>
        <div class="field"><label for="studentName">Student Name <span class="req">*</span></label><input type="text" id="studentName" placeholder="Full name" required></div>
        <div class="field"><label for="fatherName">Father's Name <span class="req">*</span></label><input type="text" id="fatherName" required></div>
        <div class="field"><label for="motherName">Mother's Name <span class="req">*</span></label><input type="text" id="motherName" required></div>
        <div class="field">
          <label for="studentClass">Class <span class="req">*</span></label>
          <select id="studentClass" required>
            <option value="">Select class</option>
            <option>Nursery</option><option>L.K.G</option><option>U.K.G</option>
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
          </select>
        </div>
        <div class="field"><label for="section">Section <span class="req">*</span></label><input type="text" id="section" placeholder="e.g. A" required></div>
      </div>

      <div class="form-section-title">Additional Details</div>
      <div class="form-grid">
        <div class="field"><label for="dob">Date of Birth <span class="req">*</span></label><input type="date" id="dob" required></div>
        <div class="field">
          <label for="gender">Gender <span class="req">*</span></label>
          <select id="gender" required><option value="">Select gender</option><option>Male</option><option>Female</option></select>
        </div>
        <div class="field"><label for="contactNumber">Contact Number</label><input type="tel" id="contactNumber" placeholder="Parent's phone number"></div>
        <div class="field"><label for="admissionDate">Admission Date</label><input type="date" id="admissionDate"></div>
        <div class="field"><label for="attendance">Attendance</label><input type="text" id="attendance" placeholder="e.g. 92%"></div>
        <div class="field full-width"><label for="previousSchool">Previous School</label><input type="text" id="previousSchool" placeholder="If applicable"></div>
        <div class="field full-width"><label for="address">Address</label><textarea id="address" placeholder="Home address"></textarea></div>
      </div>

      <div class="form-section-title">Photo (optional)</div>
      <div class="photo-upload-row">
        <label class="photo-upload-btn"><i class="fa-solid fa-camera"></i> Choose Photo<input type="file" id="photoUpload" accept="image/*" style="display:none;" aria-label="Upload photo"></label>
        <span id="uploadFilename"></span>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveStudent()"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
      </div>
    </form>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<script>
  try { Appearance.renderMenu(document.getElementById('appearanceMount'), { variant: 'inline' }); } catch(e) {}
</script>

<script src="bottom-nav.js"></script>
<script>
  try {
    BottomNav.init({
      mountId: 'bottomNav',
      activeHref: 'students.html',
      tabs: [
        { href: 'dashboard.html', icon: 'fa-house',             label: 'Home' },
        { href: 'students.html',  icon: 'fa-user-group',        label: 'Students' },
        { href: 'classes.html',   icon: 'fa-chalkboard',        label: 'Classes' },
        { href: 'fee-management.html', icon: 'fa-indian-rupee-sign', label: 'Fees' },
        { href: 'more.html',      icon: 'fa-grip',              label: 'More' }
      ]
    });
  } catch(e) {}
</script>

<script>
  try { SessionTimer.start({ flagKey: 'adminLoggedIn', loginUrl: 'admin.html' }); } catch(e) {}
</script>

<script src="site.js"></script>
</body>
</html>
