<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon- Page Not Found</title>
<style>
  :root{
    --teal-light:#bdfce7;
    --teal:#6fe3c4;
    --teal-deep:#3fae95;
    --ink:#eaf1ff;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;
    font-family:'Segoe UI', Arial, sans-serif;
    background:#020a15;
    overflow-x:hidden;
    color:var(--ink);
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }

  .page{ position:relative; width:100%; min-height:100vh; }

  /* ---------------- NAV ---------------- */
  .nav-wrap{
    position:relative;
    z-index:10;
    display:flex;
    justify-content:center;
    padding:26px 20px 0;
  }
  nav{
    display:flex;
    align-items:center;
    gap:2px;
    background:rgba(6,14,32,.55);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.06);
    border-radius:40px;
    padding:10px 8px;
  }
  nav a{
    color:#e4ecff;
    text-decoration:none;
    font-size:14px;
    font-weight:700;
    letter-spacing:.2px;
    opacity:.9;
    padding:8px 18px;
    border-radius:30px;
    transition:opacity .25s, background .25s, color .25s;
  }
  nav a:hover{ opacity:1; background:rgba(111,227,196,.14); color:var(--teal-light); }

  /* ---------------- SCENE (SVG) ---------------- */
  .scene-wrap{ position:relative; width:100%; line-height:0; background:#02101f; }
  .scene-wrap svg{ display:block; width:100%; height:auto; }

  .fan-group{
    transform-origin:902px 234px;
    animation:spin 7s linear infinite;
  }
  .fan-group-reflect{
    transform-origin:902px 234px;
    animation:spinRev 7s linear infinite;
  }
  @keyframes spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  @keyframes spinRev{ from{ transform:rotate(360deg); } to{ transform:rotate(0deg); } }

  .light-flicker{ animation:flicker 3.4s ease-in-out infinite; }
  @keyframes flicker{
    0%,100%{ opacity:1; } 45%{ opacity:.72; } 50%{ opacity:1; } 75%{ opacity:.82; }
  }

  .moon-glow{ animation:glow 5s ease-in-out infinite; }
  @keyframes glow{ 0%,100%{ opacity:.6; } 50%{ opacity:.9; } }

  .star{ animation:twinkle 3.4s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{ opacity:.2; } 50%{ opacity:1; } }

  .boat{ animation:bob 4.5s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0px); } 50%{ transform:translateY(-3px); } }

  .shooting{ opacity:0; animation:shoot 8s linear infinite; }
  @keyframes shoot{
    0%{ transform:translate(0,0); opacity:0; }
    3%{ opacity:1; }
    14%{ transform:translate(-220px,150px); opacity:0; }
    100%{ opacity:0; }
  }
  .shooting.s2{ animation-delay:4s; }

  .ripple-line{ animation:ripple 6s ease-in-out infinite; }
  @keyframes ripple{
    0%,100%{ transform:translateX(0); opacity:.5; }
    50%{ transform:translateX(14px); opacity:.9; }
  }

  .house-light{ animation:flicker 2.6s ease-in-out infinite; }

  /* ---------------- CONTENT OVERLAY ---------------- */
  .content{
    position:absolute;
    left:6.5%;
    top:30%;
    z-index:8;
    max-width:520px;
  }
  .error-code{
    font-size:clamp(70px,10vw,128px);
    font-weight:800;
    letter-spacing:2px;
    background:linear-gradient(180deg, #ffffff 0%, var(--teal-light) 35%, var(--teal-deep) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    line-height:.95;
    filter:drop-shadow(0 0 18px rgba(160,240,215,.55)) drop-shadow(0 0 46px rgba(111,227,196,.4));
  }
  .error-text{
    font-size:clamp(15px,2.1vw,23px);
    letter-spacing:6px;
    font-weight:800;
    margin-top:12px;
    color:#f6f9ff;
    text-shadow:0 2px 12px rgba(0,0,0,.4);
  }
  .btn-home{
    margin-top:28px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:14px 34px;
    background:linear-gradient(135deg, rgba(111,227,196,.38), rgba(63,174,149,.32));
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border:1.5px solid rgba(190,252,231,.55);
    border-radius:30px;
    color:#eafff7;
    font-weight:700;
    letter-spacing:1.2px;
    font-size:13.5px;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(20,50,60,.35), inset 0 1px 0 rgba(255,255,255,.2);
    transition:transform .22s ease, box-shadow .22s ease, background .22s ease;
  }
  .btn-home:hover{
    transform:translateY(-3px);
    background:linear-gradient(135deg, rgba(111,227,196,.55), rgba(63,174,149,.45));
    box-shadow:0 14px 30px rgba(20,50,60,.45), inset 0 1px 0 rgba(255,255,255,.25);
  }

  @media (max-width:768px){
    nav{ gap:0; padding:8px 4px; flex-wrap:wrap; justify-content:center; }
    nav a{ font-size:11.5px; padding:6px 10px; }
    .content{ top:24%; left:6%; }
    .error-text{ letter-spacing:4px; }
    .btn-home{ padding:12px 26px; }
  }
</style>
