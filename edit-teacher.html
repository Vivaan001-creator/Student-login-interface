<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://storage.googleapis.com https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://www.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self' mailto:">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Edit a teacher record.">
<meta name="theme-color" content="#0e1326">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="site.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="appearance.js"></script>
<script src="session-timer.js"></script>
<title>Edit Teacher - GenAlpha</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --navy-950:#0e1326; --navy-900:#161d3a; --navy-800:#232c56;
    --paper:#f7f2e4;
    --amber:#ffb347; --amber-deep:#ff8c42; --amber-shadow:#d9691f; --coral:#ff6f61;
    --ink:#241f14; --ink-soft:#6d644e; --ink-faint:#a89d84;
    --green:#2fb87f; --green-bg:#e4f7ee;
    --red:#e5584a; --red-bg:#fdeceb;
    --blue:#4a7fd6; --blue-bg:#e9f0fd;
    --purple:#8a6fe8; --purple-bg:#f0ecfd;
    --teal:#22b8a4; --teal-bg:#e3f8f5;
    --pink:#e2649e; --pink-bg:#fceaf3;
    --radius-lg:24px; --radius-md:16px;
    --surface-card:#ffffff; --surface-card-border:rgba(36,31,20,.06);
    --surface-card-shadow:rgba(36,31,20,.07); --surface-hover:#eee3cc;
    --nav-surface:#ffffff; --brand-yellow:#ffc72c; --brand-ink:#1c1c1c;
    --ease:cubic-bezier(.16,.84,.44,1);
  }

  html[data-theme="dark"]{
    --cream:#1c2444; --cream-dim:#232c56; --paper:#161d3a;
    --ink:#f3ecd9; --ink-soft:#b7bcdc; --ink-faint:#9199bb;
    --green-bg:#173a2c; --red-bg:#3a1e1c; --blue-bg:#1c2c4a;
    --purple-bg:#2a2456; --teal-bg:#173a38; --pink-bg:#3a2038;
    --surface-card:rgba(255,255,255,.045); --surface-card-border:rgba(255,255,255,.1);
    --surface-card-shadow:rgba(0,0,0,.35); --surface-hover:rgba(255,255,255,.07); --nav-surface:#1b2140;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'Inter', sans-serif; background:var(--paper); color:var(--ink); }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; }
  a{ text-decoration:none; color:inherit; }
  hr.divider{ border:none; border-top:1px solid rgba(36,31,20,.07); margin:22px 0; }

  /* ============ APP SHELL (Android) ============ */
  .app-shell{ min-height:100vh; min-height:100dvh; }
  .top-header{
    background:linear-gradient(135deg, var(--navy-900) 0%, var(--navy-950) 100%); color:#f3ecd9;
    padding:16px 16px 18px; padding-top:calc(16px + env(safe-area-inset-top,0px));
    border-radius:0 0 28px 28px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .top-header-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .header-icon-btn{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; flex-shrink:0; }
  .top-header h1{ font-family:'Fraunces', serif; font-size:16px; }
  .top-header p{ font-size:11px; color:#b7bcdc; margin-top:1px; }
  .header-actions{ display:flex; align-items:center; gap:8px; }

  .bottom-nav{ position:fixed; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--nav-surface); border:1px solid var(--surface-card-border); border-radius:26px; box-shadow:0 16px 36px rgba(20,16,10,.2); display:flex; justify-content:space-around; padding:7px 4px; max-width:612px; margin-left:auto; margin-right:auto; }
  .bn-item{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px; cursor:pointer; color:var(--ink-faint); flex:1; border-radius:16px; }
  .bn-icon-wrap{ width:40px; height:28px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:15px; transition:background .2s var(--ease), color .2s var(--ease); }
  .bn-label{ font-size:9.5px; font-weight:700; }
  .bn-item.bn-active{ color:var(--amber-deep); }
  .bn-item.bn-active .bn-icon-wrap{ background:var(--brand-yellow); color:var(--brand-ink); }

  /* ===== Main ===== */
  .main-area{ min-width:0; }
  .content{ padding:18px 16px calc(112px + env(safe-area-inset-bottom,0px)); max-width:640px; margin:0 auto; }

  /* ===== Profile hero ===== */
  .profile-hero{ position:relative; overflow:hidden; background:linear-gradient(120deg, var(--navy-900), var(--navy-950)); color:#f3ecd9; border-radius:var(--radius-lg); padding:32px 28px; margin-bottom:22px; }
  .profile-hero::before{ content:''; position:absolute; top:-50px; right:-30px; width:220px; height:220px; background:radial-gradient(circle, rgba(255,179,71,.22) 0%, transparent 70%); }
  .profile-hero-top{ position:relative; z-index:1; display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .avatar-upload-wrap{ position:relative; flex-shrink:0; }
  .profile-avatar-lg{ width:88px; height:88px; border-radius:50%; background:linear-gradient(135deg, var(--amber), var(--coral)); display:flex; align-items:center; justify-content:center; font-size:32px; color:#241608; overflow:hidden; box-shadow:0 12px 26px rgba(255,140,66,.3); }
  .profile-avatar-lg img{ width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .avatar-camera-btn{ position:absolute; bottom:0; right:0; width:30px; height:30px; border-radius:50%; background:#ffffff; border:2px solid var(--navy-950); color:#241f14; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11px; }
  .profile-hero-main{ flex:1; min-width:200px; }
  .profile-hero-main h2{ font-size:22px; margin-bottom:4px; }
  .profile-role-line{ font-size:12.5px; color:#b7bcdc; margin-bottom:10px; }
  .status-pill{ display:inline-block; font-size:11px; font-weight:700; padding:4px 12px; border-radius: 8px; margin-bottom:12px; }
  .status-active{ background:rgba(47,184,127,.18); color:#5be3a8; }
  .status-inactive{ background:rgba(229,88,74,.18); color:#f18e83; }
  .profile-hero-meta{ display:flex; gap:10px; flex-wrap:wrap; }
  .meta-chip{ display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1); padding:6px 12px; border-radius: 8px; font-size:12px; color:#e5e0cf; }
  .profile-hero-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-left:auto; }
  .btn{ display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:700; padding:11px 18px; border-radius:12px; transition:transform .15s var(--ease), box-shadow .15s var(--ease); }
  .btn-primary{ background:linear-gradient(135deg, var(--amber) 0%, var(--coral) 100%); color:#241608; box-shadow:0 4px 0 var(--amber-shadow), 0 10px 20px rgba(255,140,66,.28); }
  .btn-primary:hover{ transform:translateY(-2px); }
  .btn-secondary{ background:rgba(255,255,255,.08); color:#f3ecd9; border:1px solid rgba(255,255,255,.14); }
  .btn-secondary:hover{ background:rgba(255,255,255,.14); }

  /* ===== Stat cards ===== */
  .profile-stats-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:14px; margin-bottom:22px; }
  .mini-stat-card{ display:flex; align-items:center; gap:12px; background:var(--surface-card); border:1px solid rgba(36,31,20,.05); border-radius:var(--radius-md); padding:14px 16px; box-shadow:0 12px 26px rgba(36,31,20,.06); transition:transform .15s ease-out, box-shadow .2s var(--ease); transform-style:preserve-3d; will-change:transform; }
  .mini-stat-card:hover{ box-shadow:0 16px 32px rgba(36,31,20,.1); }
  .mini-stat-icon{ min-width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .mini-stat-icon.purple{ background:var(--purple-bg); color:var(--purple); }
  .mini-stat-icon.green{ background:var(--green-bg); color:var(--green); }
  .mini-stat-icon.blue{ background:var(--blue-bg); color:var(--blue); }
  .mini-stat-icon.orange{ background:#fdf0e3; color:var(--amber-deep); }
  .mini-stat-icon.pink{ background:var(--pink-bg); color:var(--pink); }
  .mini-stat-number{ font-size:16px; font-weight:700; }
  .mini-stat-label{ font-size:11px; color:var(--ink-soft); margin-top:1px; }

  /* ===== Cards ===== */
  .form-card{ background:var(--surface-card); border:1px solid rgba(36,31,20,.06); border-radius:var(--radius-lg); padding:24px; margin-bottom:20px; box-shadow:0 14px 32px rgba(36,31,20,.06); }
  .section-title{ font-size:15.5px; margin-bottom:16px; }
  .info-cards-row{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
  .info-list{ display:flex; flex-direction:column; gap:14px; }
  .info-row{ display:flex; align-items:center; gap:12px; }
  .info-icon{ width:34px; height:34px; border-radius:10px; background:var(--paper); color:var(--amber-deep); display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .info-text{ display:flex; flex-direction:column; gap:1px; }
  .info-label{ font-size:11px; color:var(--ink-soft); }
  .info-value{ font-size:13.5px; font-weight:600; }

  /* ===== Recent activities ===== */
  .activity-empty{ font-size:13px; color:var(--ink-soft); }
  .activity-row{ display:flex; align-items:center; gap:14px; padding:12px 0; border-top:1px solid rgba(36,31,20,.05); }
  .activity-row:first-child{ border-top:none; padding-top:0; }
  .activity-icon{ min-width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .activity-icon.purple{ background:var(--purple-bg); color:var(--purple); }
  .activity-icon.green{ background:var(--green-bg); color:var(--green); }
  .activity-icon.blue{ background:var(--blue-bg); color:var(--blue); }
  .activity-icon.orange{ background:#fdf0e3; color:var(--amber-deep); }
  .activity-icon.pink{ background:var(--pink-bg); color:var(--pink); }
  .activity-icon.teal{ background:var(--teal-bg); color:var(--teal); }
  .activity-body{ flex:1; display:flex; flex-direction:column; gap:1px; }
  .activity-body strong{ font-size:13px; }
  .activity-body span{ font-size:11.5px; color:var(--ink-soft); }
  .activity-time{ font-size:11px; color:var(--ink-faint); white-space:nowrap; }

  /* ===== View grid (professional details) ===== */
  .view-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:16px; }
  .view-grid.two-col{ grid-template-columns:1fr 1fr; }
  .view-field.full-width{ grid-column:1 / -1; }
  .view-field label{ display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.3px; }
  .view-value{ font-size:13.5px; background:var(--paper); border-radius:10px; padding:10px 14px; }
  .view-value.multiline{ line-height:1.6; white-space:pre-line; }
  .view-list{ display:flex; flex-direction:column; gap:8px; }
  .view-list-row{ display:flex; align-items:center; gap:12px; background:var(--paper); border-radius:10px; padding:10px 14px; font-size:13px; }
  .list-bullet{ min-width:22px; height:22px; border-radius:50%; background:var(--surface-card); color:var(--amber-deep); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }

  /* ===== Edit form fields ===== */
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field.full-width{ grid-column:1 / -1; }
  .field label{ font-size:12px; font-weight:600; color:var(--ink-soft); }
  .field input, .field select, .field textarea{
    padding:11px 14px; border:1.5px solid rgba(36,31,20,.1); border-radius:12px; font-size:13.5px;
    font-family:inherit; background:var(--paper); color:var(--ink); transition:border-color .2s var(--ease);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--amber-deep); }
  .field textarea{ resize:vertical; min-height:70px; }
  .save-section-btn{ margin-top:20px; display:flex; justify-content:flex-end; }
  .btn{ display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700; padding:11px 22px; border-radius:12px; transition:transform .15s var(--ease); }
  .btn-primary{ background:linear-gradient(135deg, var(--amber) 0%, var(--coral) 100%); color:#241608; box-shadow:0 4px 0 var(--amber-shadow), 0 10px 20px rgba(255,140,66,.28); }
  .btn-primary:hover{ transform:translateY(-2px); }

  @media (max-width:900px){
    .info-cards-row, .view-grid.two-col{ grid-template-columns:1fr; }
    .profile-hero-actions{ margin-left:0; width:100%; }
  }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div class="app-shell">

  <header class="top-header">
    <div class="top-header-left">
      <button class="header-icon-btn" onclick="window.location.href='teacher-profile.html'" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
      <div>
        <h1>Teacher Profile</h1>
        <p>Edit details</p>
      </div>
    </div>
    <div class="header-actions">
      <div id="appearanceMount"></div>
      <button class="header-icon-btn" aria-label="Logout" onclick="adminLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </div>
  </header>

  <div class="main-area">
    <main class="content">

      <!-- Basic Info (loaded via loadTeacher/loadEditTeacher; no dedicated save action wired in admin.js yet) -->
      <section class="form-card">
        <h3 class="section-title">Basic Info</h3>
        <div class="view-grid two-col">
          <div class="field"><label for="profileName">Full Name</label><input type="text" id="profileName"></div>
          <div class="field">
            <label for="profileSubject">Subject</label>
            <select id="profileSubject">
              <option value="">Select subject</option>
              <option>English</option><option>Math</option><option>Hindi</option><option>Computer</option>
              <option>E.V.S</option><option>G.K</option><option>Science</option><option>Social Studies</option>
            </select>
          </div>
          <div class="field">
            <label for="profileStatus">Status</label>
            <select id="profileStatus"><option value="Active">Active</option><option value="On Leave">On Leave</option></select>
          </div>
          <div class="field"><label for="profilePhone">Phone</label><input type="tel" id="profilePhone"></div>
          <div class="field"><label for="profileEmail">Email</label><input type="email" id="profileEmail"></div>
          <div class="field"><label for="teacherQualification">Qualification</label><input type="text" id="teacherQualification"></div>
          <div class="field"><label for="profileExperience">Experience (years)</label><input type="number" min="0" id="profileExperience"></div>
        </div>
        <!-- hidden mirrors so admin.js's loadTeacher() has matching elements to populate -->
        <input type="hidden" id="teacherName"><input type="hidden" id="teacherSubject">
        <input type="hidden" id="teacherPhone"><input type="hidden" id="teacherEmail">
        <input type="hidden" id="teacherExperience"><input type="hidden" id="teacherStatus">
      </section>

      <!-- Professional Details - saved via saveTeacherProfileDetails() -->
      <section class="form-card">
        <h3 class="section-title">Professional Details</h3>
        <div class="view-grid two-col">
          <div class="field"><label for="profileDesignation">Designation</label><input type="text" id="profileDesignation"></div>
          <div class="field"><label for="profileDepartment">Department</label><input type="text" id="profileDepartment"></div>
          <div class="field"><label for="profileEmployeeId">Employee ID</label><input type="text" id="profileEmployeeId"></div>
          <div class="field"><label for="profileJoiningDate">Date of Joining</label><input type="date" id="profileJoiningDate"></div>
          <div class="field full-width"><label for="profileSummary">Professional Summary</label><textarea id="profileSummary"></textarea></div>
        </div>

        <hr class="divider">
        <h3 class="section-title">Qualifications</h3>
        <div class="view-grid">
          <div class="field"><label for="profileGraduation">Graduation</label><input type="text" id="profileGraduation"></div>
          <div class="field"><label for="profilePostGraduation">Post Graduation</label><input type="text" id="profilePostGraduation"></div>
          <div class="field"><label for="profileBed">B.Ed</label><input type="text" id="profileBed"></div>
          <div class="field"><label for="profileCTET">CTET / TET</label><input type="text" id="profileCTET"></div>
          <div class="field"><label for="profileOtherQualification">Other Qualification</label><input type="text" id="profileOtherQualification"></div>
        </div>

        <hr class="divider">
        <h3 class="section-title">School History</h3>
        <div class="view-grid two-col">
          <div class="field"><label for="profileCurrentSchool">Current School</label><input type="text" id="profileCurrentSchool"></div>
          <div class="field"><label for="profilePreviousSchool">Previous School</label><input type="text" id="profilePreviousSchool"></div>
        </div>

        <hr class="divider">
        <h3 class="section-title">Achievements</h3>
        <div class="field full-width"><label for="profileAchievement">Achievements / Awards</label><textarea id="profileAchievement"></textarea></div>

        <hr class="divider">
        <h3 class="section-title">Responsibilities</h3>
        <div class="view-grid">
          <div class="field"><label for="responsibility1">Responsibility 1</label><input type="text" id="responsibility1"></div>
          <div class="field"><label for="responsibility2">Responsibility 2</label><input type="text" id="responsibility2"></div>
          <div class="field"><label for="responsibility3">Responsibility 3</label><input type="text" id="responsibility3"></div>
          <div class="field"><label for="responsibility4">Responsibility 4</label><input type="text" id="responsibility4"></div>
        </div>

        <hr class="divider">
        <h3 class="section-title">Areas of Expertise</h3>
        <div class="view-grid">
          <div class="field"><label for="expertise1">Expertise 1</label><input type="text" id="expertise1"></div>
          <div class="field"><label for="expertise2">Expertise 2</label><input type="text" id="expertise2"></div>
          <div class="field"><label for="expertise3">Expertise 3</label><input type="text" id="expertise3"></div>
          <div class="field"><label for="expertise4">Expertise 4</label><input type="text" id="expertise4"></div>
        </div>

        <hr class="divider">
        <h3 class="section-title">Contact &amp; Other</h3>
        <div class="view-grid two-col">
          <div class="field"><label for="profileOffice">Office / Cabin</label><input type="text" id="profileOffice"></div>
          <div class="field"><label for="profileAttendance">Attendance</label><input type="text" id="profileAttendance" placeholder="e.g. 96%"></div>
          <div class="field full-width"><label for="profileAddress">Address</label><textarea id="profileAddress"></textarea></div>
        </div>

        <div class="save-section-btn">
          <button type="button" class="btn btn-primary" onclick="saveTeacherProfileDetails()"><i class="fa-solid fa-floppy-disk"></i> Save Professional Details</button>
        </div>
      </section>

    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<script>
  try { Appearance.renderMenu(document.getElementById('appearanceMount'), { variant: 'inline' }); } catch(e) {}
</script>

<script src="bottom-nav.js"></script>
<script>
  try {
    BottomNav.init({
      mountId: 'bottomNav',
      activeHref: 'more.html',
      tabs: [
        { href: 'dashboard.html', icon: 'fa-house',             label: 'Home' },
        { href: 'students.html',  icon: 'fa-user-group',        label: 'Students' },
        { href: 'classes.html',   icon: 'fa-chalkboard',        label: 'Classes' },
        { href: 'fee-management.html', icon: 'fa-indian-rupee-sign', label: 'Fees' },
        { href: 'more.html',      icon: 'fa-grip',              label: 'More' }
      ]
    });
  } catch(e) {}
</script>


<script>
  try { SessionTimer.start({ flagKey: 'adminLoggedIn', loginUrl: 'admin.html' }); } catch(e) {}
</script>

<script type="module" src="admin.js"></script>
<nav class="legal-links" aria-label="Legal"><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="cookies.html">Cookies</a><a href="refund.html">Refunds</a></nav>
<script src="site.js"></script>
</body>
</html>
