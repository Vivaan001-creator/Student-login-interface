<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7E9E2;
    --paper-deep:#DEE2D6;
    --rule:#C6CBBB;
    --rule-faint: rgba(35,42,34,0.055);
    --ink:#232A22;
    --ink-muted:#565E4F;
    --accent:#AE3320;
    --tab:#D7CDA6;
    --tab-text:#5A5238;
    --white:#FBF9F1;
    --radius:7px;
    --serif:'Source Serif 4', Georgia, serif;
    --sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:var(--sans); background:var(--paper); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  *:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  #app{ display:flex; flex-direction:column; height:100vh; height:100dvh; }

  header{ padding:16px 18px 0; background:var(--paper); flex-shrink:0; }
  .chat-header-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .chat-header-row h1{ flex:1; font-family:var(--serif); font-weight:600; font-size:1.35rem; margin:0; letter-spacing:.2px; }
  #hamburger-btn, #menu-btn{ background:none; border:none; color:var(--ink); padding:6px; cursor:pointer; display:flex; border-radius:5px; flex-shrink:0; }
  #hamburger-btn:hover, #menu-btn:hover{ background:var(--paper-deep); }

  .menu-wrap{ position:relative; flex-shrink:0; }
  #menu-dropdown{
    display:none; position:absolute; right:0; top:calc(100% + 6px); background:var(--white);
    border:1px solid var(--rule); border-radius:var(--radius); min-width:152px; z-index:20;
    box-shadow:0 4px 14px rgba(35,42,34,0.18); overflow:hidden;
  }
  #menu-dropdown.open{ display:block; }
  #menu-dropdown button{
    display:block; width:100%; text-align:left; background:none; border:none; padding:10px 14px;
    font-family:var(--sans); font-size:.85rem; color:var(--ink); cursor:pointer;
  }
  #menu-dropdown button:hover{ background:var(--paper-deep); }

  nav.tabs{ display:flex; }
  nav.tabs button{
    flex:1; border:none; background:var(--tab); color:var(--tab-text);
    font-family:var(--sans); font-size:.82rem; font-weight:500; padding:9px 2px;
    margin-top:6px; cursor:pointer; border-right:1px solid rgba(35,42,34,0.08);
    transition: margin-top .15s ease, background .15s ease, color .15s ease;
  }
  nav.tabs button:last-child{ border-right:none; }
  nav.tabs button.active{ background:var(--paper-deep); color:var(--ink); font-weight:600; margin-top:0; }

  .panels{ flex:1; min-height:0; position:relative; background:var(--paper-deep); }
  .panel{
    position:absolute; inset:0; display:none; flex-direction:column;
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 27px, var(--rule-faint) 27px, var(--rule-faint) 28px);
  }
  .panel.active{ display:flex; }

  /* Sidebar */
  #sidebar-backdrop{ display:none; position:fixed; inset:0; background:rgba(20,22,17,.4); z-index:29; }
  #sidebar-backdrop.open{ display:block; }
  #sidebar{
    position:fixed; top:0; left:0; bottom:0; width:min(80vw,270px); background:var(--paper);
    border-right:1px solid var(--rule); z-index:30; transform:translateX(-100%);
    transition:transform .25s ease; display:flex; flex-direction:column;
  }
  #sidebar.open{ transform:translateX(0); }
  .sidebar-head{ display:flex; justify-content:space-between; align-items:center; padding:16px 14px; border-bottom:1px solid var(--rule); flex-shrink:0; }
  .sidebar-title{ font-family:var(--serif); font-weight:600; font-size:1.15rem; }
  #sidebar-close{ background:none; border:none; color:var(--ink-muted); font-size:1rem; cursor:pointer; }
  #new-chat-btn{
    margin:12px 14px; padding:9px 12px; border:1px solid var(--rule); border-radius:var(--radius);
    background:var(--white); color:var(--ink); font-family:var(--sans); font-size:.9rem; cursor:pointer; text-align:left; flex-shrink:0;
  }
  #chat-list{ flex:1; overflow-y:auto; }
  .chat-row{ border-bottom:1px solid var(--rule); }
  .chat-row.active .chat-row-main{ background:var(--paper-deep); }
  .chat-row-main{
    display:flex; flex-direction:column; align-items:flex-start; width:100%; text-align:left;
    background:none; border:none; padding:10px 12px 4px; cursor:pointer; font-family:var(--sans);
  }
  .chat-row-title{ font-size:.88rem; color:var(--ink); word-break:break-word; }
  .chat-row-time{ font-size:.72rem; color:var(--ink-muted); margin-top:2px; }
  .chat-row-actions{ display:flex; gap:12px; padding:0 12px 8px; }
  .row-action{ background:none; border:none; font-size:.72rem; color:var(--ink-muted); text-decoration:underline; cursor:pointer; padding:0; font-family:var(--sans); }
  .row-action:hover{ color:var(--ink); }
  .row-action-danger:hover{ color:var(--accent); }

  /* Attach sheet */
  #attach-backdrop{ display:none; position:fixed; inset:0; background:rgba(20,22,17,.4); z-index:24; }
  #attach-backdrop.open{ display:block; }
  #attach-sheet{
    display:none; position:fixed; left:0; right:0; bottom:0; background:var(--paper);
    border-top:1px solid var(--rule); border-radius:14px 14px 0 0; z-index:25;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  }
  #attach-sheet.open{ display:block; }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .sheet-title{ font-family:var(--serif); font-weight:600; font-size:1.05rem; }
  #attach-close{ background:none; border:none; color:var(--ink-muted); font-size:1rem; cursor:pointer; }
  .sheet-actions{ display:flex; gap:10px; margin-bottom:14px; }
  .sheet-action{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 6px;
    border:1px solid var(--rule); border-radius:var(--radius); background:var(--white); color:var(--ink);
    font-family:var(--sans); font-size:.8rem; cursor:pointer;
  }
  .sheet-action:hover{ background:var(--paper-deep); }
  .sheet-icon{ color:var(--ink-muted); }
  .sheet-toggle-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 2px; font-size:.9rem; border-top:1px solid var(--rule); padding-top:14px; }
  .switch{ position:relative; width:42px; height:24px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch .slider{ position:absolute; inset:0; background:var(--rule); border-radius:999px; transition:.2s; cursor:pointer; }
  .switch .slider:before{ content:''; position:absolute; width:18px; height:18px; left:3px; top:3px; background:var(--white); border-radius:50%; transition:.2s; }
  .switch input:checked + .slider{ background:var(--accent); }
  .switch input:checked + .slider:before{ transform:translateX(18px); }

  /* Chat */
  #chat-log{ flex:1; overflow-y:auto; padding:16px 16px 6px; }
  .msg{
    max-width:82%; padding:10px 13px; border-radius:var(--radius); margin-bottom:10px;
    line-height:1.45; font-size:.95rem; white-space:pre-wrap; word-wrap:break-word;
    animation:settle .22s ease-out;
  }
  @keyframes settle{ from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .msg{ animation:none; } }
  .msg.user{ margin-left:auto; background:var(--accent); color:var(--white); border-bottom-right-radius:2px; }
  .msg.assistant{ margin-right:auto; background:var(--white); border:1px solid var(--rule); border-bottom-left-radius:2px; }
  .msg.assistant.err{ background:none; border:1px dashed var(--accent); color:var(--accent); font-size:.85rem; }
  .msg.thinking{ display:flex; gap:4px; align-items:center; }
  .msg-img{ display:block; max-width:100%; border-radius:5px; }
  .file-chip{ font-size:.82rem; background:rgba(251,249,241,0.35); border:1px solid rgba(251,249,241,0.5); border-radius:5px; padding:6px 9px; margin-bottom:4px; display:inline-block; }
  .msg.assistant .file-chip{ background:rgba(35,42,34,0.06); border-color:var(--rule); }
  .msg-actions{ display:flex; gap:12px; margin-top:6px; }
  .msg-actions button{
    background:none; border:none; padding:0; font-size:.72rem; color:var(--ink-muted);
    text-decoration:underline; cursor:pointer; font-family:var(--sans);
  }
  .msg-actions button:hover{ color:var(--accent); }
  .dot{ width:5px; height:5px; border-radius:50%; background:var(--ink-muted); animation:pulse 1.1s infinite ease-in-out; }
  .dot:nth-child(2){ animation-delay:.15s; } .dot:nth-child(3){ animation-delay:.3s; }
  @keyframes pulse{ 0%,60%,100%{opacity:.3;} 30%{opacity:1;} }
  .empty{ margin:auto; text-align:center; color:var(--ink-muted); font-size:.9rem; padding:0 24px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
  .chip{
    border:1px solid var(--rule); background:var(--white); color:var(--ink); padding:7px 12px;
    border-radius:5px; font-size:.83rem; cursor:pointer; font-family:var(--sans);
  }
  .chip:hover{ background:var(--paper-deep); }

  #image-preview, #file-preview{ display:none; align-items:center; gap:8px; padding:8px 12px 0; }
  #image-preview img{ width:46px; height:46px; object-fit:cover; border-radius:5px; border:1px solid var(--rule); }
  #file-preview{ font-size:.85rem; color:var(--ink); }
  #remove-image, #remove-file{ background:none; border:none; color:var(--ink-muted); font-size:.85rem; cursor:pointer; }

  #chat-form{
    display:flex; gap:6px; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--rule); background:var(--paper-deep); flex-shrink:0;
  }
  #chat-input{
    flex:1; resize:none; border:1px solid var(--rule); border-radius:var(--radius);
    padding:9px 10px; font-family:var(--sans); font-size:.95rem; background:var(--white);
    color:var(--ink); max-height:100px; min-width:0;
  }
  #attach-btn, #mic-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--rule); background:var(--white);
    color:var(--ink-muted); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  #mic-btn.recording{ background:var(--accent); color:var(--white); border-color:var(--accent); }
  #send-btn{
    width:36px; height:36px; border-radius:50%; border:none; background:var(--accent);
    color:var(--white); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  #send-btn:disabled{ opacity:.5; cursor:default; }

  /* Shared rows (tasks/notes/students) */
  .add-row{ display:flex; flex-wrap:wrap; gap:8px; padding:14px 16px; border-bottom:1px solid var(--rule); flex-shrink:0; }
  .add-row input[type=text], .add-row textarea{
    flex:1; min-width:100px; border:1px solid var(--rule); border-radius:var(--radius); padding:9px 12px;
    font-family:var(--sans); font-size:.92rem; background:var(--white); color:var(--ink);
  }
  .add-row input[type=date]{
    border:1px solid var(--rule); border-radius:var(--radius); padding:9px 8px;
    font-family:var(--sans); font-size:.85rem; background:var(--white); color:var(--ink); width:118px;
  }
  .add-row textarea{ resize:vertical; min-height:38px; }
  .add-row button{
    border:none; background:var(--accent); color:var(--white); border-radius:var(--radius);
    padding:0 16px; font-family:var(--sans); font-size:.9rem; font-weight:500; cursor:pointer;
  }
  #task-list, #note-list, #student-list{ flex:1; overflow-y:auto; padding:4px 16px 16px; }

  .task-row{ display:flex; align-items:flex-start; gap:10px; padding:12px 0; border-bottom:1px solid var(--rule); }
  .check{
    width:20px; height:20px; border:1.5px solid var(--ink-muted); border-radius:4px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; margin-top:1px;
    font-size:.85rem; color:var(--accent); font-weight:700; background:var(--white);
  }
  .check.done{ border-color:var(--accent); }
  .task-body{ flex:1; min-width:0; }
  .task-text{ font-size:.94rem; line-height:1.4; word-wrap:break-word; }
  .task-text.done{ text-decoration:line-through; color:var(--ink-muted); }
  .task-due{ font-size:.76rem; color:var(--ink-muted); margin-top:2px; }
  .del{ background:none; border:none; color:var(--ink-muted); font-size:1rem; cursor:pointer; flex-shrink:0; padding:0 2px; line-height:1; }
  .del:hover{ color:var(--accent); }

  .note-row{ padding:14px 0; border-bottom:1px solid var(--rule); }
  .note-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .note-ts{ font-size:.74rem; color:var(--ink-muted); flex-shrink:0; }
  .note-text{ font-size:.93rem; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; margin-top:4px; }

  .student-row{ border-bottom:1px solid var(--rule); padding:10px 0; }
  .student-head{ display:flex; justify-content:space-between; align-items:center; cursor:pointer; gap:8px; }
  .student-name-wrap{ display:flex; flex-direction:column; }
  .student-name{ font-size:.95rem; font-weight:500; }
  .student-subject{ font-size:.78rem; color:var(--ink-muted); margin-top:1px; }
  .student-details{ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .student-details input, .student-details textarea{
    border:1px solid var(--rule); border-radius:var(--radius); padding:8px 10px;
    font-family:var(--sans); font-size:.88rem; background:var(--white); color:var(--ink); resize:vertical;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="chat-header-row">
      <button id="hamburger-btn" aria-label="Chat list">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <h1>Assistant</h1>
      <div class="menu-wrap">
        <button id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
        </button>
        <div id="menu-dropdown" role="menu">
          <button role="menuitem" id="menu-export">Export data</button>
          <button role="menuitem" id="menu-import">Import data</button>
          <button role="menuitem" id="menu-clear">Clear chat</button>
        </div>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button data-tab="chat" class="active" role="tab" aria-selected="true">Chat</button>
      <button data-tab="students" role="tab" aria-selected="false">Students</button>
      <button data-tab="tasks" role="tab" aria-selected="false">Tasks</button>
      <button data-tab="notes" role="tab" aria-selected="false">Notes</button>
    </nav>
  </header>

  <div class="panels">
    <section class="panel active" id="panel-chat">
      <div id="chat-log"></div>
      <div id="image-preview">
        <img id="image-preview-img" alt="">
        <button id="remove-image" aria-label="Remove photo">Remove ✕</button>
      </div>
      <div id="file-preview">
        <span id="file-preview-name"></span>
        <button id="remove-file" aria-label="Remove file">Remove ✕</button>
      </div>
      <form id="chat-form">
        <button id="attach-btn" type="button" aria-label="Add to chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <textarea id="chat-input" rows="1" placeholder="Ask for anything..."></textarea>
        <button id="mic-btn" type="button" aria-label="Voice input">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 003-3V6a3 3 0 00-6 0v6a3 3 0 003 3z" stroke="currentColor" stroke-width="1.8"/><path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button id="send-btn" type="submit" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M12 5L5 12M12 5l7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">
      <input type="file" id="photos-input" accept="image/*" style="display:none">
      <input type="file" id="file-input" accept="application/pdf" style="display:none">
    </section>

    <section class="panel" id="panel-students">
      <form class="add-row" id="student-form">
        <input type="text" id="student-name" placeholder="Student name" autocomplete="off">
        <input type="text" id="student-subject" placeholder="Subject / class" autocomplete="off">
        <button type="submit">Add</button>
      </form>
      <div id="student-list"></div>
    </section>

    <section class="panel" id="panel-tasks">
      <form class="add-row" id="task-form">
        <input type="text" id="task-input" placeholder="Add a task" autocomplete="off">
        <input type="date" id="task-due" aria-label="Due date">
        <button type="submit">Add</button>
      </form>
      <div id="task-list"></div>
    </section>

    <section class="panel" id="panel-notes">
      <form class="add-row" id="note-form">
        <textarea id="note-input" placeholder="Write a note" rows="1"></textarea>
        <button type="submit">Add</button>
      </form>
      <div id="note-list"></div>
    </section>
  </div>
</div>

<div id="sidebar-backdrop"></div>
<aside id="sidebar">
  <div class="sidebar-head">
    <span class="sidebar-title">Assistant</span>
    <button id="sidebar-close" aria-label="Close menu">✕</button>
  </div>
  <button id="new-chat-btn" type="button">+ New chat</button>
  <div id="chat-list"></div>
</aside>

<div id="attach-backdrop"></div>
<div id="attach-sheet">
  <div class="sheet-head">
    <button id="attach-close" aria-label="Close">✕</button>
    <span class="sheet-title">Add to chat</span>
    <span style="width:16px"></span>
  </div>
  <div class="sheet-actions">
    <button type="button" class="sheet-action" id="action-camera">
      <span class="sheet-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="14" r="3.2" stroke="currentColor" stroke-width="1.6"/></svg></span>
      <span>Camera</span>
    </button>
    <button type="button" class="sheet-action" id="action-photos">
      <span class="sheet-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="9.5" r="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M4 16l4.5-4.5 3 3L16 9l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
      <span>Photos</span>
    </button>
    <button type="button" class="sheet-action" id="action-files">
      <span class="sheet-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M7 3.5h7l4 4v13a1 1 0 01-1 1H7a1 1 0 01-1-1v-16a1 1 0 011-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13.5 3.5V8h4.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
      <span>Files</span>
    </button>
  </div>
  <label class="sheet-toggle-row">
    <span>Web search</span>
    <span class="switch"><input type="checkbox" id="ws-toggle" checked><span class="slider"></span></span>
  </label>
</div>
<input type="file" id="import-input" accept="application/json" style="display:none">

<script>
const SYSTEM_BASE = "You are the personal assistant inside a small web app that Vivaan built for himself. Vivaan is a private home tutor who also builds his own tuition-management software. Talk to him the way Claude talks: warm, direct, conversational, no corporate stiffness, no filler. He sometimes writes in Hinglish (a Hindi-English mix) -- if he does, feel free to reply in kind. You can search the web when he needs current information (unless he's turned that off), and he can send you photos or PDF files (like a student's worksheet) for you to look at. He can ask you for anything: help planning his tutoring work, drafting things for students or parents, thinking through a task, tracking students, or just chatting. Keep answers reasonably concise unless he clearly wants depth.";

const QUICK_PROMPTS = [
  {label:'Note to a parent', prompt:'Help me draft a short note to a parent about '},
  {label:'Quick quiz', prompt:'Make a 5-question quiz on '},
  {label:"Plan today's lesson", prompt:"Help me plan today's lesson on "},
  {label:'Explain simply', prompt:'Explain this in a simple way for a student: '}
];

let chats = [];
let activeChatId = null;
let tasks = [];
let notes = [];
let students = [];
let thinking = false;
let pendingImage = null;
let pendingFile = null;
let webSearchEnabled = true;
let expandedStudents = new Set();

const $ = (sel) => document.querySelector(sel);
const chatLog = $('#chat-log');
const taskList = $('#task-list');
const noteList = $('#note-list');
const studentList = $('#student-list');

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function activeChat(){ return chats.find(c=>c.id === activeChatId) || chats[0]; }

function relTime(ts){
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if(m < 1) return 'just now';
  if(m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if(h < 24) return h + 'h ago';
  const d = Math.floor(h / 24);
  if(d < 7) return d + 'd ago';
  return new Date(ts).toLocaleDateString('en-US', {month:'short', day:'numeric'});
}

function resizeImage(file, maxDim, quality){
  maxDim = maxDim || 1024; quality = quality || 0.7;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale); h = Math.round(h * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.readAsDataURL(file);
  });
}

  if(chats.length === 0){

    legacy = legacy.map(m => ({
      id: m.id || uid(), role: m.role,
      text: m.text !== undefined ? m.text : (m.content || ''),
      image: m.image || null, file: null, isError: !!m.isError
    }));

    activeChatId = chats.slice().sort((a,b)=>b.updatedAt - a.updatedAt)[0].id;

      messages: c.messages.slice(-60).map(m => (m.image || m.file)

function buildContext(){
  let ctx = '';
  const open = tasks.filter(t=>!t.done);
  if(open.length){
    const list = open.slice(0,15).map(t => t.text + (t.due ? ' (due ' + fmtDate(t.due) + ')' : '')).join('; ');
    ctx += '\n\nHis current open tasks: ' + list + '.';
  }
  if(students.length){
    const list = students.slice(0,30).map(s => s.name + (s.subject ? ' (' + s.subject + ')' : '')).join(', ');
    ctx += '\n\nHis students: ' + list + '.';
  }
  return ctx;
}

/* ---------- Chat ---------- */
function toApiContent(m){
  const blocks = [];
  if(m.image){
    const match = m.image.match(/^data:(image\/[a-zA-Z]+);base64,(.*)$/);
    if(match) blocks.push({type:'image', source:{type:'base64', media_type:match[1], data:match[2]}});
  }
  if(m.file){
    blocks.push({type:'document', source:{type:'base64', media_type:m.file.mediaType, data:m.file.data}});
  }
  if(blocks.length === 0) return m.text || '';
  if(m.text) blocks.push({type:'text', text:m.text});
  return blocks;
}

function renderChat(){
  const chat = activeChat();
  const msgs = chat ? chat.messages : [];
  chatLog.innerHTML = '';
  if(msgs.length === 0){
    const wrap = document.createElement('div');
    wrap.className = 'empty';
    const p = document.createElement('div');
    p.textContent = "Say hello, or try one of these:";
    wrap.appendChild(p);
    const chipsRow = document.createElement('div');
    chipsRow.className = 'chips';
    QUICK_PROMPTS.forEach(q=>{
      const c = document.createElement('button');
      c.type = 'button'; c.className = 'chip'; c.textContent = q.label;
      c.addEventListener('click', ()=>{
        const input = $('#chat-input');
        input.value = q.prompt;
        input.dispatchEvent(new Event('input'));
        input.focus();
      });
      chipsRow.appendChild(c);
    });
    wrap.appendChild(chipsRow);
    chatLog.appendChild(wrap);
    return;
  }
  msgs.forEach((m, i)=>{
    const d = document.createElement('div');
    d.className = 'msg ' + m.role + (m.isError ? ' err' : '');
    if(m.image){
      const img = document.createElement('img');
      img.className = 'msg-img'; img.src = m.image; img.alt = '';
      d.appendChild(img);
    }
    if(m.file){
      const chip = document.createElement('div');
      chip.className = 'file-chip';
      chip.textContent = '📄 ' + m.file.name;
      d.appendChild(chip);
    }
    if(m.text){
      const p = document.createElement('div');
      p.textContent = m.text;
      if(m.image || m.file) p.style.marginTop = '6px';
      d.appendChild(p);
    }
    if(m.role === 'assistant' && !m.isError && m.text){
      const actions = document.createElement('div');
      actions.className = 'msg-actions';
      const copyBtn = document.createElement('button');
      copyBtn.type = 'button'; copyBtn.textContent = 'Copy';
      copyBtn.addEventListener('click', ()=>{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(m.text).then(()=>{
            copyBtn.textContent = 'Copied';
            setTimeout(()=>{ copyBtn.textContent = 'Copy'; }, 1200);
          }).catch(()=>{});
        }
      });
      actions.appendChild(copyBtn);
      if(navigator.share){
        const shareBtn = document.createElement('button');
        shareBtn.type = 'button'; shareBtn.textContent = 'Share';
        shareBtn.addEventListener('click', ()=>{ navigator.share({text:m.text}).catch(()=>{}); });
        actions.appendChild(shareBtn);
      }
      if(i === msgs.length - 1){
        const retryBtn = document.createElement('button');
        retryBtn.type = 'button'; retryBtn.textContent = 'Retry';
        retryBtn.addEventListener('click', ()=> retryLast());
        actions.appendChild(retryBtn);
      }
      d.appendChild(actions);
    }
    chatLog.appendChild(d);
  });
  if(thinking){
    const d = document.createElement('div');
    d.className = 'msg assistant thinking';
    d.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    chatLog.appendChild(d);
  }
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function sendToApi(){
  const chat = activeChat();
  thinking = true;
  $('#send-btn').disabled = true;
  renderChat();
  try{
    const apiMessages = chat.messages.filter(m=>!m.isError).map(m=>({role:m.role, content:toApiContent(m)}));
    const body = {
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      system: SYSTEM_BASE + buildContext(),
      messages: apiMessages
    };
    if(webSearchEnabled){ body.tools = [{type:'web_search_20250305', name:'web_search'}]; }
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    const reply = (data.content || []).filter(b=>b.type === 'text').map(b=>b.text).join('\n').trim();
    chat.messages.push({id:uid(), role:'assistant', text: reply || "I didn't quite get a reply there — try asking again?", image:null, file:null, isError:false});
  }catch(err){
    chat.messages.push({id:uid(), role:'assistant', text:"Couldn't reach the assistant — check your connection and try again.", image:null, file:null, isError:true});
  }finally{
    thinking = false;
    $('#send-btn').disabled = false;
    chat.updatedAt = Date.now();
    renderChat(); renderSidebarList();
    saveChats();
  }
}
async function retryLast(){
  if(thinking) return;
  const chat = activeChat();
  while(chat.messages.length && chat.messages[chat.messages.length - 1].role === 'assistant'){
    chat.messages.pop();
  }
  renderChat();
  await sendToApi();
}

function renderTasks(){

    row.className = 'task-row';

    const check = document.createElement('div');
    check.className = 'check' + (t.done ? ' done' : '');
    check.textContent = t.done ? '✓' : '';
    check.setAttribute('role','checkbox');
    check.setAttribute('aria-checked', t.done ? 'true' : 'false');
    check.setAttribute('tabindex','0');
    const toggle = ()=>{ t.done = !t.done; renderTasks(); saveTasks(); };
    check.addEventListener('click', toggle);
    check.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } });

    const body = document.createElement('div');
    body.className = 'task-body';
    const txt = document.createElement('div');
    txt.className = 'task-text' + (t.done ? ' done' : '');
    txt.textContent = t.text;
    body.appendChild(txt);
    if(t.due){
      const due = document.createElement('div');
      due.className = 'task-due';
      due.textContent = 'Due ' + fmtDate(t.due);
      body.appendChild(due);
    }

    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕'; del.setAttribute('aria-label','Delete task');
    del.addEventListener('click', ()=>{ tasks = tasks.filter(x=>x.id !== t.id); renderTasks(); saveTasks(); });

    row.appendChild(check); row.appendChild(body); row.appendChild(del);
    taskList.appendChild(row);
  });
}

$('#task-form').addEventListener('submit', (e)=>{
  e.preventDefault();
  const input = $('#task-input');
  const due = $('#task-due');
  const text = input.value.trim();
  if(!text) return;
  tasks.unshift({id:uid(), text, done:false, due: due.value || null});
  input.value = ''; due.value = '';
  renderTasks();
  saveTasks();
});

/* ---------- Notes ---------- */
function renderNotes(){
  noteList.innerHTML = '';
  if(notes.length === 0){
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'No notes yet.';
    noteList.appendChild(e);
    return;
  }
  notes.forEach(n=>{
    const row = document.createElement('div');
    row.className = 'note-row';

    const top = document.createElement('div');
    top.className = 'note-top';
    const ts = document.createElement('span');
    ts.className = 'note-ts';
    ts.textContent = new Date(n.ts).toLocaleDateString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕'; del.setAttribute('aria-label','Delete note');
    del.addEventListener('click', ()=>{ notes = notes.filter(x=>x.id !== n.id); renderNotes(); saveNotes(); });
    top.appendChild(ts); top.appendChild(del);

    const txt = document.createElement('div');
    txt.className = 'note-text';
    txt.textContent = n.text;

    row.appendChild(top); row.appendChild(txt);
    noteList.appendChild(row);
  });
}

$('#note-form').addEventListener('submit', (e)=>{
  e.preventDefault();
  const input = $('#note-input');
  const text = input.value.trim();
  if(!text) return;
  notes.unshift({id:uid(), text, ts:Date.now()});
  input.value = '';
  input.style.height = 'auto';
  renderNotes();
  saveNotes();
});
$('#note-input').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

loadAll();
</script>
