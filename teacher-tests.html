<title>Online Tests - GenAlpha</title>
<meta name="description" content="Create, publish and review online tests for your class.">
<meta name="theme-color" content="#0e1326">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<script>SessionTimer.start({ flagKey: 'teacherLoggedIn', loginUrl: "teacher-login.html" });</script>

<body class="ep">
<header class="ep-bar">
  <a class="ep-back" href="teacher-dashboard.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
  <div class="ep-title"><h1 id="pageTitle">Online Tests</h1><p id="pageSub">Create tests and see results</p></div>
  <div id="appearanceMount"></div>
</header>
<main class="ep-main" id="main">
  <div id="pageLoading" class="ep-loading" role="status">Loading your tests...</div>
  <div id="noClass" class="ep-notice warn" hidden><strong>No class assigned yet</strong>You can create tests once the admin assigns a class to you.</div>
  <div id="content" hidden>
    <div class="ep-actions" style="margin:0 0 16px"><a class="ep-btn primary" href="teacher-test-edit.html" id="createBtn">Create a test</a></div>
    <div id="list" class="t-list"></div>
    <p id="emptyState" class="t-empty" hidden>No tests yet. Tap Create a test to design your first one.</p>
  </div>
</main>
<script src="site.js"></script>
<script type="module" src="teacher-tests.js"></script>
