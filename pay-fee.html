<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="appearance.js"></script>
<title>Fee Payment - Home Tuition</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#f7f2e4; --ink:#241f14; --ink-soft:#7a715c; --ink-faint:#a89d84;
    --amber:#ffb347; --amber-deep:#ff8c42; --amber-shadow:#d9691f; --coral:#ff6f61;
    --navy-900:#161d3a; --navy-950:#0e1326;
    --radius-lg:24px; --radius-md:14px;
    --ease:cubic-bezier(.16,.84,.44,1);
    --surface-card:#ffffff; --surface-card-border:rgba(36,31,20,.06); --surface-card-shadow:rgba(36,31,20,.1);
  }
  html[data-theme="dark"]{
    --paper:#161d3a; --ink:#f3ecd9; --ink-soft:#b7bcdc; --ink-faint:#7c84a8;
    --surface-card:rgba(255,255,255,.045); --surface-card-border:rgba(255,255,255,.1); --surface-card-shadow:rgba(0,0,0,.35);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'Inter', sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; transition:background-color .5s ease, color .5s ease; }
  h1,h2{ font-family:'Fraunces', serif; font-weight:600; }
  a{ text-decoration:none; }

  @keyframes fadeInPage{ from{opacity:0;} to{opacity:1;} }
  @keyframes slideUpFade{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }

  .pay-page{ max-width:460px; margin:0 auto; padding:32px 20px 60px; animation:fadeInPage .5s ease both; }
  .pay-back{ display:inline-flex; align-items:center; gap:8px; color:var(--amber-shadow); font-size:13px; font-weight:700; margin-bottom:18px; transition:gap .2s var(--ease); }
  .pay-back:hover{ gap:11px; }

  .pay-card{ background:var(--surface-card); border:1px solid var(--surface-card-border); border-radius:var(--radius-lg); box-shadow:0 20px 50px var(--surface-card-shadow); padding:32px 26px; text-align:center; animation:slideUpFade .5s var(--ease) both; }
  .pay-icon{ width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg, var(--amber) 0%, var(--coral) 100%); color:#241608; display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 18px; box-shadow:0 10px 22px rgba(255,140,66,.3); }
  .pay-who{ font-size:13px; color:var(--ink-soft); margin-bottom:2px; }
  .pay-period{ font-size:17px; font-weight:700; margin-bottom:20px; }
  .pay-amount-label{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.5px; }
  .pay-amount{ font-size:42px; font-weight:800; margin:4px 0 20px; font-family:'Fraunces', serif; }
  .pay-amount-lock{ font-size:11.5px; color:var(--ink-faint); margin-top:-14px; margin-bottom:22px; display:flex; align-items:center; justify-content:center; gap:6px; }

  .btn-upi{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    background:linear-gradient(135deg, var(--amber) 0%, var(--coral) 100%); color:#241608; border:none;
    border-radius:999px; padding:15px; font-size:14.5px; font-weight:700; font-family:inherit; cursor:pointer; margin-bottom:16px;
    box-shadow:0 4px 0 var(--amber-shadow), 0 14px 26px rgba(255,140,66,.28);
    transition:transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .btn-upi:hover{ transform:translateY(-2px); box-shadow:0 6px 0 var(--amber-shadow), 0 18px 32px rgba(255,140,66,.34); }
  .btn-upi:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--amber-shadow), 0 8px 16px rgba(255,140,66,.3); }

  .pay-divider{ display:flex; align-items:center; gap:10px; color:var(--ink-faint); font-size:11px; font-weight:700; letter-spacing:.5px; margin:18px 0 16px; }
  .pay-divider .line{ flex:1; height:1px; background:rgba(36,31,20,.09); }
  .pay-confirm-hint{ font-size:12.5px; color:var(--ink-soft); margin-bottom:16px; line-height:1.6; text-align:left; }
  .pay-confirm-hint strong{ color:var(--ink); }

  .btn-confirm-paid{
    width:100%; background:var(--navy-900); color:#f3ecd9; border:none; border-radius:999px;
    padding:15px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 4px 0 var(--navy-950), 0 12px 24px rgba(14,19,38,.2);
    transition:transform .15s var(--ease), box-shadow .15s var(--ease), opacity .2s var(--ease);
  }
  .btn-confirm-paid:not(:disabled):hover{ transform:translateY(-2px); }
  .btn-confirm-paid:not(:disabled):active{ transform:translateY(2px); box-shadow:0 2px 0 var(--navy-950), 0 6px 14px rgba(14,19,38,.2); }
  .btn-confirm-paid:disabled{ opacity:.45; cursor:default; box-shadow:none; }

  .pay-cancel{ display:block; text-align:center; margin-top:18px; color:var(--ink-soft); font-size:12.5px; }
  .pay-cancel:hover{ color:var(--amber-deep); }

  .pay-state-msg{ text-align:center; padding:50px 10px; color:var(--ink-soft); font-size:14px; }
  .pay-state-msg i{ font-size:32px; display:block; margin-bottom:14px; color:var(--amber-deep); }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div id="appearanceMount"></div>

<div class="pay-page">
  <a href="parent-dashboard.html" class="pay-back"><i class="fa-solid fa-arrow-left"></i> Dashboard par vaapas jaayein</a>

  <div id="payContent">
    <div class="pay-state-msg"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
  </div>
</div>

<script>
  Appearance.renderMenu(document.getElementById('appearanceMount'), { variant: 'corner' });
</script>

<script type="module" src="pay-fee.js?v=2"></script>
</body>
</html>
