<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://storage.googleapis.com https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://www.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self' mailto:">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Upload and manage gallery photos.">
<meta name="theme-color" content="#0e1326">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="site.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="appearance.js"></script>
<script src="session-timer.js"></script>
<title>Gallery - GenAlpha</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --navy-950:#0e1326; --navy-900:#161d3a; --navy-800:#232c56;
    --cream:#fdf6e8; --cream-dim:#f4e8d0; --paper:#f7f2e4;
    --amber:#ffb347; --amber-deep:#ff8c42; --amber-shadow:#d9691f; --coral:#ff6f61;
    --ink:#241f14; --ink-soft:#6d644e; --ink-faint:#a89d84;
    --green:#2fb87f; --green-bg:#e4f7ee;
    --red:#e5584a; --red-bg:#fdeceb;
    --blue:#4a7fd6; --blue-bg:#e9f0fd;
    --purple:#8a6fe8; --purple-bg:#f0ecfd;
    --teal:#22b8a4; --teal-bg:#e3f8f5;
    --pink:#e2649e; --pink-bg:#fceaf3;
    --radius-lg:24px; --radius-md:16px; --radius-sm:12px;
    --surface-card:#ffffff; --surface-card-border:rgba(36,31,20,.06);
    --surface-card-shadow:rgba(36,31,20,.07); --surface-hover:#eee3cc; --nav-surface:#ffffff;
    --brand-yellow:#ffc72c; --brand-ink:#1c1c1c;
    --ease:cubic-bezier(.16,.84,.44,1);
  }

  html[data-theme="dark"]{
    --cream:#1c2444; --cream-dim:#232c56; --paper:#161d3a;
    --ink:#f3ecd9; --ink-soft:#b7bcdc; --ink-faint:#9199bb;
    --green-bg:#173a2c; --red-bg:#3a1e1c; --blue-bg:#1c2c4a;
    --purple-bg:#2a2456; --teal-bg:#173a38; --pink-bg:#3a2038;
    --surface-card:rgba(255,255,255,.045); --surface-card-border:rgba(255,255,255,.1);
    --surface-card-shadow:rgba(0,0,0,.35); --surface-hover:rgba(255,255,255,.07); --nav-surface:#1b2140;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:'Inter', sans-serif; background:var(--paper); color:var(--ink); }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; }
  a{ text-decoration:none; color:inherit; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(36,31,20,.15); border-radius:8px; }

  /* ============ APP SHELL (Android) ============ */
  .app-shell{ min-height:100vh; min-height:100dvh; }
  .top-header{
    background:linear-gradient(135deg, var(--navy-900) 0%, var(--navy-950) 100%); color:#f3ecd9;
    padding:16px 16px 18px; padding-top:calc(16px + env(safe-area-inset-top,0px));
    border-radius:0 0 28px 28px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .top-header-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .header-icon-btn{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; flex-shrink:0; }
  .top-header h1{ font-family:'Fraunces', serif; font-size:16px; }
  .top-header p{ font-size:11px; color:#b7bcdc; margin-top:1px; }
  .header-actions{ display:flex; align-items:center; gap:8px; }

  .bottom-nav{ position:fixed; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--nav-surface); border:1px solid var(--surface-card-border); border-radius:26px; box-shadow:0 16px 36px rgba(20,16,10,.2); display:flex; justify-content:space-around; padding:7px 4px; max-width:612px; margin-left:auto; margin-right:auto; }
  .bn-item{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px; cursor:pointer; color:var(--ink-faint); flex:1; border-radius:16px; }
  .bn-icon-wrap{ width:40px; height:28px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:15px; transition:background .2s var(--ease), color .2s var(--ease); }
  .bn-label{ font-size:9.5px; font-weight:700; }
  .bn-item.bn-active{ color:var(--amber-deep); }
  .bn-item.bn-active .bn-icon-wrap{ background:var(--brand-yellow); color:var(--brand-ink); }

  /* ============ MAIN ============ */
  .main{ padding:18px 16px calc(112px + env(safe-area-inset-bottom,0px)); max-width:640px; margin:0 auto; }

  .page-topbar{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
  .page-topbar-left h1{ font-size:clamp(22px,3.5vw,28px); }
  .page-topbar-left p{ font-size:13px; color:var(--ink-soft); margin-top:6px; }
  .btn-add-class{
    display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--amber) 0%, var(--coral) 100%); color:#241608;
    font-weight:700; font-size:13.5px; font-family:inherit; padding:12px 22px; border-radius:12px;
    box-shadow:0 4px 0 var(--amber-shadow), 0 10px 22px rgba(255,140,66,.28);
    transition:transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .btn-add-class:hover{ transform:translateY(-2px); box-shadow:0 6px 0 var(--amber-shadow), 0 14px 26px rgba(255,140,66,.34); }
  .btn-add-class:active{ transform:translateY(2px); box-shadow:0 2px 0 var(--amber-shadow), 0 6px 14px rgba(255,140,66,.3); }

  .classes-card{ background:var(--surface-card); border:1px solid rgba(36,31,20,.06); border-radius:var(--radius-lg); padding:24px; box-shadow:0 16px 36px rgba(36,31,20,.07); margin-bottom:20px; }
  .classes-card-toolbar{ margin-bottom:18px; }
  .search-box-wrap{ position:relative; max-width:420px; }
  .search-box-wrap i{ position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:13px; }
  .search-box-wrap input{ width:100%; padding:12px 16px 12px 40px; border:1.5px solid rgba(36,31,20,.09); border-radius:12px; font-size:13.5px; font-family:inherit; background:var(--paper); transition:border-color .2s var(--ease); }
  .search-box-wrap input:focus{ outline:none; border-color:var(--amber-deep); }

  .table-wrapper{ overflow-x:auto; border-radius:var(--radius-md); border:1px solid rgba(36,31,20,.06); margin-bottom:22px; }
  table.classes-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.classes-table th{ text-align:left; background:var(--paper); color:var(--ink-soft); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.3px; padding:13px 16px; white-space:nowrap; }
  table.classes-table td{ padding:13px 16px; border-top:1px solid rgba(36,31,20,.05); }
  @keyframes rowFadeIn{ from{opacity:0; transform:translateX(-6px);} to{opacity:1; transform:translateX(0);} }
  table.classes-table tbody tr{ animation:rowFadeIn .4s var(--ease) both; }

  .status-active{ background:var(--green-bg); color:var(--green); font-size:11px; font-weight:700; padding:4px 11px; border-radius:999px; white-space:nowrap; }
  .status-inactive{ background:var(--red-bg); color:var(--red); font-size:11px; font-weight:700; padding:4px 11px; border-radius:999px; white-space:nowrap; }

  .action-btns{ display:flex; gap:6px; flex-wrap:wrap; }
  .action-btns button{ display:inline-flex; align-items:center; gap:5px; border:none; cursor:pointer; font-family:inherit; font-size:11.5px; font-weight:600; padding:7px 12px; border-radius:9px; transition:transform .15s var(--ease), filter .15s var(--ease); }
  .action-btns button:hover{ transform:translateY(-2px); }
  .btn-view{ background:var(--blue-bg); color:var(--blue); }
  .btn-edit{ background:#fdf0e3; color:var(--amber-deep); }
  .btn-delete{ background:var(--red-bg); color:var(--red); }

  .mini-stats-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:14px; }
  .mini-stat-card{ display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid rgba(36,31,20,.05); border-radius:var(--radius-md); padding:14px 16px; transition:transform .15s ease-out, box-shadow .2s var(--ease); transform-style:preserve-3d; will-change:transform; }
  .mini-stat-card:hover{ box-shadow:0 12px 24px rgba(36,31,20,.1); }
  .mini-stat-icon{ min-width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .mini-stat-icon.purple{ background:var(--purple-bg); color:var(--purple); }
  .mini-stat-icon.blue{ background:var(--blue-bg); color:var(--blue); }
  .mini-stat-icon.green{ background:var(--green-bg); color:var(--green); }
  .mini-stat-icon.orange{ background:#fdf0e3; color:var(--amber-deep); }
  .mini-stat-number{ font-size:16px; font-weight:700; }
  .mini-stat-label{ font-size:11px; color:var(--ink-soft); margin-top:1px; }

  .quick-tips-box{ display:flex; align-items:center; justify-content:space-between; gap:20px; background:linear-gradient(120deg, var(--navy-900), var(--navy-950)); color:#f3ecd9; border-radius:var(--radius-lg); padding:26px 28px; margin-bottom:20px; }
  .quick-tips-text h3{ font-size:15px; display:flex; align-items:center; gap:8px; margin-bottom:12px; color:var(--amber); }
  .quick-tips-text ul{ list-style:none; display:flex; flex-direction:column; gap:7px; }
  .quick-tips-text li{ font-size:12.5px; color:#c7cbe0; line-height:1.5; padding-left:16px; position:relative; }
  .quick-tips-text li::before{ content:'-'; position:absolute; left:0; color:var(--amber); }
  .quick-tips-illustration{ font-size:52px; color:rgba(255,179,71,.25); flex-shrink:0; }

  .footer{ text-align:center; font-size:12px; color:var(--ink-faint); padding:10px 0 6px; }

  /* ===== Modal ===== */
  .modal-backdrop{ display:none; position:fixed; inset:0; background:rgba(14,19,38,.55); z-index:60; align-items:center; justify-content:center; padding:20px; }
  .modal-backdrop.open{ display:flex; }
  .modal-card{ background:var(--surface-card); border-radius:var(--radius-lg); padding:26px 24px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; box-shadow:0 30px 70px rgba(0,0,0,.3); animation:modalIn .3s var(--ease) both; }
  @keyframes modalIn{ from{opacity:0; transform:translateY(16px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .modal-header h2{ font-size:17px; }
  .modal-close{ background:var(--paper); border:none; width:32px; height:32px; border-radius:10px; cursor:pointer; color:var(--ink-soft); font-size:13px; }
  .modal-close:hover{ background:#eee3cc; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label{ font-size:12.5px; font-weight:600; color:var(--ink); }
  .field input, .field select{ padding:11px 14px; border:1.5px solid rgba(36,31,20,.1); border-radius:12px; font-size:13.5px; font-family:inherit; background:var(--paper); color:var(--ink); transition:border-color .2s var(--ease); }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--amber-deep); }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  .btn{ display:inline-flex; align-items:center; gap:8px; border:none; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700; padding:11px 20px; border-radius:12px; transition:transform .15s var(--ease); }
  .btn-primary{ background:linear-gradient(135deg, var(--amber) 0%, var(--coral) 100%); color:#241608; box-shadow:0 4px 0 var(--amber-shadow), 0 10px 20px rgba(255,140,66,.28); }
  .btn-primary:hover{ transform:translateY(-2px); }
  .btn-secondary{ background:var(--paper); color:var(--ink-soft); border:1.5px solid rgba(36,31,20,.09); }
  .btn-secondary:hover{ background:#eee3cc; }

  .class-name-cell{ display:flex; align-items:center; gap:10px; }
  .class-icon-badge{ width:34px; height:34px; border-radius:10px; background:var(--purple-bg); color:var(--purple); display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .class-name-text strong{ display:block; font-size:13.5px; }
  .class-name-text small{ font-size:11px; color:var(--ink-soft); }
  .teacher-cell small{ display:block; font-size:11px; color:var(--ink-soft); }
  .section-badge{ display:inline-block; background:var(--paper); font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; margin:1px; }

  .gallery-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:16px; }
  .gallery-thumb{ position:relative; border-radius:var(--radius-md); overflow:hidden; background:var(--paper); aspect-ratio:1/1; box-shadow:0 10px 22px rgba(36,31,20,.08); transition:transform .2s var(--ease); }
  .gallery-thumb:hover{ transform:translateY(-4px); }
  .gallery-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-thumb-overlay{ position:absolute; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:10px; background:linear-gradient(180deg, rgba(14,19,38,.55), transparent); }
  .gallery-thumb-category{ font-size:10.5px; font-weight:700; color:#fff; background:rgba(255,255,255,.18); padding:3px 9px; border-radius:999px; backdrop-filter:blur(4px); }
  .gallery-thumb-delete{ width:28px; height:28px; border-radius:50%; background:rgba(229,88,74,.9); color:#fff; border:none; cursor:pointer; font-size:11px; display:flex; align-items:center; justify-content:center; }
  .gallery-thumb-caption{ position:absolute; bottom:0; left:0; right:0; padding:8px 10px; background:linear-gradient(0deg, rgba(14,19,38,.7), transparent); color:#fff; font-size:12px; font-weight:600; }
  .photo-upload-btn{ display:inline-flex; align-items:center; gap:8px; background:var(--paper); border:1.5px dashed rgba(36,31,20,.18); border-radius:12px; padding:11px 18px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; width:100%; justify-content:center; margin-bottom:14px; }
  .photo-upload-btn:hover{ border-color:var(--amber-deep); color:var(--amber-deep); }

  @media (max-width:900px){
    .quick-tips-box{ flex-direction:column; align-items:flex-start; }
  }

  @media (max-width:760px){
    table.classes-table thead{ display:none; }
    table.classes-table, table.classes-table tbody, table.classes-table tr, table.classes-table td{ display:block; width:100%; }
    table.classes-table tr{ box-sizing:border-box; margin:10px 0; border:1px solid rgba(36,31,20,.08); border-radius:14px; padding:6px 14px; background:var(--surface-card); }
    table.classes-table td{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 0; border:none; border-bottom:1px solid rgba(36,31,20,.05); text-align:right; }
    table.classes-table td:last-child{ border-bottom:none; }
    table.classes-table td::before{ content:attr(data-label); font-weight:600; color:var(--ink-soft); font-size:11px; text-align:left; }
  }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  .loading-state{ text-align:center; padding:36px 20px; color:var(--ink-soft); font-size:13px; }
  .spinner{ width:32px; height:32px; border:3px solid rgba(255,140,66,.15); border-top-color:var(--amber-deep);
    border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="app-shell">

  <header class="top-header">
    <div class="top-header-left">
      <button class="header-icon-btn" onclick="window.location.href='more.html'" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
      <div>
        <h1>Gallery</h1>
        <p>Upload and manage photos</p>
      </div>
    </div>
    <div class="header-actions">
      <div id="appearanceMount"></div>
      <button class="header-icon-btn" aria-label="Logout" onclick="adminLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </div>
  </header>

  <div class="main gallery-page">
    <header class="page-topbar">
      <div class="page-topbar-left">
        <h1>Gallery</h1>
        <p>Upload photos of events, activities and celebrations here.</p>
      </div>
      <button class="btn-add-class" onclick="openGalleryModal()"><i class="fa-solid fa-circle-plus"></i> Add Photo</button>
    </header>

    <section class="classes-card">
      <div class="gallery-grid" id="galleryGrid"><div class="loading-state" style="grid-column:1/-1;"><div class="spinner"></div>Loading gallery...</div></div>
    </section>

    <footer class="footer"><nav class="footer-links" aria-label="Legal"><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="cookies.html">Cookies</a><a href="refund.html">Refunds</a></nav><div>&copy; <span data-year>2026</span> GenAlpha</div></footer>
<script src="site.js"></script>
  </div>
</div>

<!-- Add Photo Modal -->
<div class="modal-backdrop" id="galleryModalBackdrop">
  <div class="modal-card">
    <div class="modal-header">
      <h2>Add Photo</h2>
      <button type="button" class="modal-close" onclick="closeGalleryModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="galleryForm">
      <label class="photo-upload-btn"><i class="fa-solid fa-camera"></i> Choose Photo<input type="file" id="galleryFile" accept="image/*" style="display:none;" aria-label="Choose gallery photo"></label>
      <div class="field">
        <label for="galleryCategory">Category <span style="color:var(--coral);">*</span></label>
        <select id="galleryCategory" required>
          <option value="">Select category</option>
          <option>Events</option><option>Classroom</option><option>Activities</option>
          <option>Field Trip</option><option>Celebrations</option><option>Other</option>
        </select>
      </div>
      <div class="field"><label for="galleryTitle">Caption</label><input type="text" id="galleryTitle" placeholder="Optional caption"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeGalleryModal()">Cancel</button>
        <button type="button" id="gallerySaveBtn" class="btn btn-primary" onclick="saveGalleryPhoto()"><i class="fa-solid fa-upload"></i> Upload</button>
      </div>
    </form>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<script>
  try { Appearance.renderMenu(document.getElementById('appearanceMount'), { variant: 'inline' }); } catch(e) {}
</script>

<script src="bottom-nav.js"></script>
<script>
  try {
    BottomNav.init({
      mountId: 'bottomNav',
      activeHref: 'more.html',
      tabs: [
        { href: 'dashboard.html', icon: 'fa-house',             label: 'Home' },
        { href: 'students.html',  icon: 'fa-user-group',        label: 'Students' },
        { href: 'classes.html',   icon: 'fa-chalkboard',        label: 'Classes' },
        { href: 'fee-management.html', icon: 'fa-indian-rupee-sign', label: 'Fees' },
        { href: 'more.html',      icon: 'fa-grip',              label: 'More' }
      ]
    });
  } catch(e) {}
</script>


<script>
  document.addEventListener('DOMContentLoaded', function(){
    if (!window.matchMedia('(hover:hover)').matches || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.querySelectorAll('.mini-stat-card').forEach(card => {
      card.addEventListener('pointermove', (e) => {
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left)/r.width - 0.5;
        const y = (e.clientY - r.top)/r.height - 0.5;
        card.style.transform = `perspective(600px) rotateY(${x*8}deg) rotateX(${-y*8}deg) translateY(-2px)`;
      });
      card.addEventListener('pointerleave', () => { card.style.transform = ''; });
    });
  });
</script>

<script>
  try { SessionTimer.start({ flagKey: 'adminLoggedIn', loginUrl: 'admin.html' }); } catch(e) {}
</script>

<script type="module" src="admin.js"></script>
</body>
</html>
